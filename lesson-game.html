<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cantonese Reader — Matching Game</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <a href="#" id="back-link" class="muted">&larr; Back to lesson</a>
    <h1 id="game-title" style="margin-bottom:2px;"></h1>
    <p class="muted">Match each character to its meaning. Tap two cards.</p>

    <div class="game-stats">
      <div><span id="stat-moves">0</span> moves</div>
      <div><span id="stat-time">0:00</span></div>
      <div><span id="stat-matched">0</span>/<span id="stat-total">0</span> matched</div>
    </div>

    <div id="game-grid" class="game-grid"></div>

    <div id="game-done" class="card" style="display:none; text-align:center;">
      <h2 style="margin-top:0;">🎉 Nice work!</h2>
      <p id="game-summary" class="muted"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn secondary" id="replay-btn">Play again</button>
        <a class="btn" id="done-back-link" href="#">Back to lesson</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/lesson-game.js"></script>
</body>
</html>
