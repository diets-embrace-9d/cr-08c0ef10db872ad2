<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cantonese Reader — Lists</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <h1>My Lists</h1>
    <p class="muted">Words you've saved while reading or working through a lesson.</p>

    <div class="card">
      <div class="btn-row">
        <input type="text" id="new-list-name" placeholder="New list name" style="flex:1;" />
        <button class="btn" id="new-list-btn">+ Create list</button>
      </div>
    </div>

    <div id="lists-container"></div>
  </div>

  <script type="module" src="js/lists.js"></script>
</body>
</html>
