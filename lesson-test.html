<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cantonese Reader — Lesson Test</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <a href="#" id="back-link" class="muted">&larr; Back to lesson</a>
    <h1 id="test-title" style="margin-bottom:2px;"></h1>
    <p class="muted">What does each word mean? Missed words will show up more often in Review.</p>

    <div class="card" style="padding:12px 16px;">
      <label for="test-scope-select" style="display:block; font-size:0.85rem; color:var(--muted); margin-bottom:6px;">
        Wrong-answer difficulty (always tests this lesson's words)
      </label>
      <select id="test-scope-select">
        <option value="lesson">Normal — distractors from this course</option>
        <option value="completed">Harder — distractors from all completed lessons</option>
      </select>
      <label style="display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.9rem;">
        <input type="checkbox" id="auto-advance-toggle" />
        Auto-advance when I answer correctly
      </label>
    </div>

    <p class="test-progress" id="test-progress"></p>

    <div id="test-area"></div>

    <div id="test-done" class="card" style="display:none;">
      <h2 style="margin-top:0; text-align:center;" id="test-score"></h2>
      <p class="muted" id="test-srs-note" style="text-align:center;"></p>
      <div id="test-results"></div>
      <div class="btn-row" style="justify-content:center; margin-top:14px;">
        <button class="btn secondary" id="retake-btn">Retake test</button>
        <a class="btn ghost" id="done-back-link" href="#">Back to lesson</a>
        <a class="btn" href="review.html">Go to Review</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/lesson-test.js"></script>
</body>
</html>
